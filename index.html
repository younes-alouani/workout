<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee">
<title>Entraînement</title>
<style>
:root{
  --bg:#f5f3ee; --card:#ffffff; --ink:#1c2220; --muted:#6b736f; --line:#e2ded5;
  --accent:#2d6e5b; --accent-soft:#e2eee8;
  --fig:#1c2220; --fig-far:#b4bab7; --prop:#b95f2c; --prop-far:#e2b597;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121514; --card:#1b1f1d; --ink:#eceeed; --muted:#99a19d; --line:#2b302e;
    --accent:#6cc2a5; --accent-soft:#1d2e27;
    --fig:#eceeed; --fig-far:#545b58; --prop:#ec9a63; --prop-far:#7a5236;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:480px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;
  padding:max(16px,env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}

.stage-wrap{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;touch-action:pan-y}
.stage-wrap svg{display:block;width:100%;height:auto}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.arrow svg{width:20px;height:20px}
.arrow.prev{left:10px} .arrow.next{right:10px}
.arrow[hidden]{display:none}

.info{padding:18px 4px 8px;flex:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px}
.dots{display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
h1{font-size:24px;line-height:1.2;margin:10px 0 4px;letter-spacing:-.01em}
.dose{font-size:30px;font-weight:700;letter-spacing:-.01em}
.dose small{font-size:15px;font-weight:500;color:var(--muted);margin-left:6px}
.cue{color:var(--muted);margin:8px 0 0}

nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;
  position:sticky;bottom:calc(8px + env(safe-area-inset-bottom))}
nav button{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:11px;padding:12px 0;background:transparent;color:var(--muted);cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg)}
.limb{fill:none;stroke:var(--fig);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.limb.far{stroke:var(--fig-far)}
.torso{stroke-width:10}
.head{fill:var(--fig)}
.prop rect{fill:var(--prop)}
.prop.far rect{fill:var(--prop-far)}
.ring{fill:none;stroke:var(--prop);stroke-width:3}
.ring.far{stroke:var(--prop-far)}
.strap{stroke:var(--muted);stroke-width:1.5}
.strap.far{stroke:var(--fig-far)}
.floor{stroke:var(--line);stroke-width:3;stroke-linecap:round}
.floor.moving{stroke:var(--fig-far);stroke-dasharray:16 12}
</style>
</head>
<body>
<div class="app">
  <div class="stage-wrap" id="stage">
    <button class="arrow prev" id="prev" aria-label="Exercice précédent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="arrow next" id="next" aria-label="Exercice suivant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>

  <div class="info">
    <div class="top"><span class="tag" id="tag"></span><span class="dots" id="dots"></span></div>
    <h1 id="name"></h1>
    <div class="dose" id="dose"></div>
    <p class="cue" id="cue"></p>
  </div>

  <nav id="nav"></nav>
</div>

<script>
/* ---------- Stick figure engine (plain SVG, no library) ---------- */
const NS = 'http://www.w3.org/2000/svg';
const L = { torso:52, neck:17, ua:30, fa:28, th:40, shin:40 };
const rad = a => a * Math.PI / 180;
const dir = a => [Math.sin(rad(a)), Math.cos(rad(a))]; // 0 = down, 90 = forward, 180 = up

function ik(root, tgt, a, b, pref){
  const dx = tgt[0]-root[0], dy = tgt[1]-root[1];
  const d = Math.min(Math.max(Math.hypot(dx,dy), Math.abs(a-b)+0.01), a+b-0.01);
  const base = Math.atan2(dy,dx);
  const A = Math.acos((a*a + d*d - b*b) / (2*a*d));
  const c1 = [root[0]+a*Math.cos(base+A), root[1]+a*Math.sin(base+A)];
  const c2 = [root[0]+a*Math.cos(base-A), root[1]+a*Math.sin(base-A)];
  const score = p => (p[0]-root[0])*pref[0] + (p[1]-root[1])*pref[1];
  const j = score(c1) >= score(c2) ? c1 : c2;
  const ex = tgt[0]-j[0], ey = tgt[1]-j[1], e = Math.hypot(ex,ey) || 0.001;
  return [j, [j[0]+b*ex/e, j[1]+b*ey/e]];
}
function solve(ex, p){
  let hip = p.hip;
  if (ex.rigidLegs){ // straight body: keep the hip at leg length from the planted feet
    const f = p.feet[0], dx = hip[0]-f[0], dy = hip[1]-f[1], d = Math.hypot(dx,dy);
    hip = [f[0] + 79.8*dx/d, f[1] + 79.8*dy/d];
  }
  if (ex.kneel){ // kneeling: knee fixed on the floor, shin flat behind it
    const k = ex.kneel, dx = hip[0]-k[0], dy = hip[1]-k[1], d = Math.hypot(dx,dy);
    hip = [k[0] + L.th*dx/d, k[1] + L.th*dy/d];
  }
  const td = dir(p.t);
  const sh = [hip[0]+L.torso*td[0], hip[1]+L.torso*td[1]];
  const head = [sh[0]+L.neck*td[0], sh[1]+L.neck*td[1]];
  const arms = [0,1].map(i => {
    const h = p.hands[i];
    return ik(sh, ex.handsRel ? [sh[0]+h[0], sh[1]+h[1]] : h, L.ua, L.fa, ex.elbow[i]);
  });
  const legs = [0,1].map(i => {
    if (ex.kneel) return [ex.kneel, [ex.kneel[0]-L.shin, ex.kneel[1]+1]];
    const f = p.feet[i];
    return ik(hip, ex.feetRel ? [hip[0]+f[0], hip[1]+f[1]] : f, L.th, L.shin, ex.knee[i]);
  });
  return { hip, sh, head, arms, legs };
}
function lerp(a, b, u){
  if (typeof a === 'number') return a + (b-a)*u;
  if (Array.isArray(a)) return a.map((v,i) => lerp(v, b[i], u));
  const o = {}; for (const k in a) o[k] = lerp(a[k], b[k], u); return o;
}
const ease = u => 0.5 - 0.5*Math.cos(Math.PI*u);

/* ---------- Exercises ---------- */
const P = (hx,hy,t,hands,feet) => ({ hip:[hx,hy], t, hands, feet });
const rep = (a,b,holdA,down,holdB,up) => ({ frames:[a,a,b,b], durs:[holdA,down,holdB,up] });
const STAND = [[154,200],[147,200]];
const HANG  = [[2,56],[4,56]];
const RACK  = [[10,-4],[13,-4]];

function walk(seg){
  const s = [1,0,-1,0];
  return {
    handsRel:true, feetRel:true, linear:true, walk:true, stride:46, props:{ db:[true,false] },
    elbow:[[-1,0],[-1,0]], knee:[[1,0],[1,0]],
    frames:[
      P(150,122,180,[[3,57],[10,55]],[[24,76],[-22,76]]),
      P(150,120,180,[[3,57],[0,55]],[[1,78],[6,66]]),
      P(150,122,180,[[3,57],[-10,55]],[[-22,76],[24,76]]),
      P(150,120,180,[[3,57],[0,55]],[[6,66],[1,78]])
    ],
    durs:[seg,seg,seg,seg]
  };
}

const EX = {
  frontSquat: { name:'Squat avant avec deux haltères',
    cue:'Haltères posés sur les épaules, coudes hauts, buste droit, descendez à la verticale entre les talons.',
    handsRel:true, elbow:[[1,0.2],[1,0.2]], knee:[[1,0],[1,0]], props:{ db:[true,true] },
    ...rep(P(150,120,180,RACK,STAND), P(131,164,158,RACK,STAND), 350,1400,250,1300) },
  split: { name:'Fente statique avec haltères',
    cue:'Grand écart entre les pieds, le genou arrière descend à la verticale, le talon avant reste au sol.',
    handsRel:true, elbow:[[-1,0],[-1,0]], knee:[[1,0],[0.3,1]], props:{ db:[true,true] },
    ...rep(P(143,130,180,HANG,[[180,200],[103,198]]), P(142,150,180,HANG,[[180,200],[103,198]]), 350,1400,250,1300) },
  rdl: { name:'Soulevé de terre roumain avec haltères',
    cue:'Genoux légèrement fléchis, poussez les hanches vers l\'arrière, les haltères glissent le long des jambes.',
    handsRel:true, elbow:[[-1,0],[-1,0]], knee:[[1,0],[1,0]], props:{ db:[true,true] },
    ...rep(P(150,120,180,HANG,[[152,200],[147,200]]), P(126,126,98,[[-12,52],[-10,52]],[[152,200],[147,200]]), 350,1500,250,1300) },
  ringPush: { name:'Pompes aux anneaux',
    cue:'Corps aligné de la tête aux pieds, anneaux près des côtes en bas du mouvement.',
    rigidLegs:true, elbow:[[-1,-1],[-1,-1]], knee:[[0,-1],[0,-1]], rings:[200,204],
    ...rep(P(158,150.6,126,[[200,178],[204,178]],[[93,198],[93,198]]),
           P(169.2,174.9,106.7,[[200,178],[204,178]],[[93,198],[93,198]]), 400,1300,250,1200) },
  ohp: { name:'Développé militaire debout avec haltères',
    cue:'Abdos et fessiers contractés, poussez à la verticale, finissez les biceps près des oreilles.',
    handsRel:true, elbow:[[0.3,1],[0.3,1]], knee:[[1,0],[1,0]], props:{ db:[true,true] },
    ...rep(P(150,120,180,RACK,STAND), P(150,120,180,[[3,-56],[6,-56]],STAND), 350,1100,300,1400) },
  ringRow: { name:'Rowing aux anneaux',
    cue:'Talons au sol, serrez les omoplates et tirez les anneaux vers la poitrine.',
    rigidLegs:true, elbow:[[-0.7,0.7],[-0.7,0.7]], knee:[[0,-1],[0,-1]], rings:[163,167],
    ...rep(P(162.2,155.6,238,[[163,93],[167,93]],[[230,198],[230,198]]),
           P(178.6,136.7,220,[[163,93],[167,93]],[[230,198],[230,198]]), 350,1100,300,1400) },
  abWheel: { name:'Rollout à la roulette abdominale',
    cue:'À genoux, bassin rentré, roulez devant vous sans creuser le bas du dos, puis revenez en contractant les abdos.',
    kneel:[110,197], elbow:[[0,-1],[0,-1]], knee:[[0,1],[0,1]], props:{ wheel:true },
    ...rep(P(123.7,159.4,120,[[168.7,192],[168.7,192]],[[70,198],[70,198]]),
           P(147.6,183.3,100,[[253,192],[253,192]],[[70,198],[70,198]]), 400,1700,350,1500) },
  pullup: { name:'Tractions aux anneaux',
    cue:'Partez suspendu bras tendus, corps gainé et jambes serrées. Tirez les coudes vers les côtes jusqu\'à ce que la poitrine arrive aux anneaux, puis redescendez sans vous balancer.',
    feetRel:true, noFloor:true, elbow:[[0.5,1],[0.5,1]], knee:[[1,0],[1,0]], rings:[150,154],
    ...rep(P(150,133,180,[[150,24],[154,24]],[[10,78.5],[10,78.5]]),
           P(152.5,79.2,195,[[150,24],[154,24]],[[14,78],[14,78]]), 500,1100,400,1600) },
  dbRow: { name:'Rowing unilatéral avec haltère',
    cue:'Main libre sur le genou avant, dos plat, tirez l\'haltère vers la hanche puis redescendez lentement.',
    handsRel:true, elbow:[[-0.3,-1],[-1,0]], knee:[[1,0],[1,0]], props:{ db:[true,false] },
    ...rep(P(138,130,105,[[0,56],[-20,48]],[[120,198],[175,200]]),
           P(138,130,105,[[-22,16],[-20,48]],[[120,198],[175,200]]), 350,1000,350,1400) },
  rollout: { name:'Rollout aux anneaux',
    cue:'Côtes basses, fessiers serrés, allez seulement aussi loin que le bas du dos reste neutre.',
    kneel:[110,197], elbow:[[0,-1],[0,-1]], knee:[[0,1],[0,1]], rings:[189,193],
    ...rep(P(118,158,122,[[189,182],[193,182]],[[70,198],[70,198]]),
           P(147.6,183.3,100,[[255.6,169.3],[259.6,169.3]],[[70,198],[70,198]]), 400,1700,350,1500) },
  carry: { name:'Marche avec haltère d\'un côté',
    cue:'Haltère dans une main, restez droit sans pencher vers la charge. Changez de côté.',
    ...walk(430) }
};

/* Session order: lower and upper body alternate so each muscle group rests
   while the next one works; the heaviest leg lift and the hardest pulling
   move come while fresh; rows come before the hinge so the lower back is not
   already tired from RDLs; core and grip-heavy carries come last because the
   trunk stabilises every lift before them. */
const PATTERNS = [
  { label:'Squat', opts:[ { ex:'frontSquat', w:'Séance A', sets:'3 × 8-12' },
                          { ex:'split',      w:'Séance B', sets:'3 × 8-12', unit:'par jambe' } ] },
  { label:'Pull', opts:[ { ex:'ringRow',   w:'Séance A', sets:'3 × 8-15' },
                          { ex:'pullup',     w:'Séance B', sets:'3 × 5-10' },
                          { ex:'dbRow',      w:'Option sans barre', sets:'3 × 8-12', unit:'par bras' } ] },
  { label:'Hinge', opts:[ { ex:'rdl',    w:'Séances A et B', sets:'3 × 8-12' } ] },
  { label:'Push', opts:[ { ex:'ringPush', w:'Séance A', sets:'3 × 8-15' },
                          { ex:'ohp',        w:'Séance B', sets:'3 × 8-12' } ] },
  { label:'Core', opts:[ { ex:'rollout',  w:'Séance A', sets:'3 × 8-15' },
                          { ex:'carry',      w:'Séance B', sets:'3 × 30-60 s', unit:'par côté' },
                          { ex:'abWheel',    w:'Option roulette', sets:'3 × 8-15' } ] }
];

/* ---------- Rendering ---------- */
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function dumbbell(parent, far){
  const g = el('g', { class:'prop' + (far ? ' far' : '') }, parent);
  el('rect', { x:-9, y:-1.5, width:18, height:3, rx:1 }, g);
  el('rect', { x:-12, y:-6, width:5, height:12, rx:1.5 }, g);
  el('rect', { x:7, y:-6, width:5, height:12, rx:1.5 }, g);
  return g;
}
function buildFigure(svg, ex){
  const f = { legs:[], arms:[], db:[], straps:[], rings:[] };
  f.floor = el('line', { x1:12, y1:201, x2:288, y2:201, class:'floor' + (ex.walk ? ' moving' : ''), visibility: ex.noFloor ? 'hidden' : 'visible' }, svg);
  if (ex.rings) [1,0].forEach(i => f.straps[i] = el('line', { class:'strap' + (i ? ' far' : '') }, svg));
  f.legs[1] = el('polyline', { class:'limb far' }, svg);
  f.arms[1] = el('polyline', { class:'limb far' }, svg);
  if (ex.props?.db?.[1]) f.db[1] = dumbbell(svg, true);
  if (ex.rings) f.rings[1] = el('circle', { r:6, class:'ring far' }, svg);
  f.torso = el('line', { class:'limb torso' }, svg);
  f.head = el('circle', { r:10, class:'head' }, svg);
  f.legs[0] = el('polyline', { class:'limb' }, svg);
  f.arms[0] = el('polyline', { class:'limb' }, svg);
  if (ex.props?.db?.[0]) f.db[0] = dumbbell(svg, false);
  if (ex.rings) f.rings[0] = el('circle', { r:6, class:'ring' }, svg);
  if (ex.props?.wheel){
    f.wheel = el('g', { class:'wheel' }, svg);
    el('circle', { r:9, class:'ring' }, f.wheel);
    el('line', { x1:-9, y1:0, x2:9, y2:0, class:'ring' }, f.wheel);
    el('line', { x1:0, y1:-9, x2:0, y2:9, class:'ring' }, f.wheel);
  }
  return f;
}
const n = v => v.toFixed(1);
const pts = a => a.map(p => n(p[0]) + ',' + n(p[1])).join(' ');
function draw(f, ex, s){
  for (const i of [0,1]){
    f.legs[i].setAttribute('points', pts([s.hip, ...s.legs[i]]));
    f.arms[i].setAttribute('points', pts([s.sh, ...s.arms[i]]));
    const h = s.arms[i][1];
    if (f.db[i]) f.db[i].setAttribute('transform', `translate(${n(h[0])},${n(h[1]+2)})`);
    if (ex.rings){
      Object.entries({ x1:ex.rings[i], y1:0, x2:n(h[0]), y2:n(h[1]-6) }).forEach(([k,v]) => f.straps[i].setAttribute(k, v));
      f.rings[i].setAttribute('cx', n(h[0])); f.rings[i].setAttribute('cy', n(h[1]));
    }
  }
  Object.entries({ x1:n(s.hip[0]), y1:n(s.hip[1]), x2:n(s.sh[0]), y2:n(s.sh[1]) }).forEach(([k,v]) => f.torso.setAttribute(k, v));
  f.head.setAttribute('cx', n(s.head[0])); f.head.setAttribute('cy', n(s.head[1]));
  if (f.wheel){ // the wheel rolls on the floor, its spokes turn with the distance covered
    const h = s.arms[0][1];
    f.wheel.setAttribute('transform', `translate(${n(h[0])},${n(h[1])}) rotate(${n(h[0] / 9 * 180 / Math.PI)})`);
  }
}
function poseAt(ex, clock){
  const total = ex.durs.reduce((a,b) => a+b, 0);
  let t = clock % total, i = 0;
  while (t > ex.durs[i] && i < ex.durs.length-1){ t -= ex.durs[i]; i++; }
  const u = Math.min(t / ex.durs[i], 1);
  return lerp(ex.frames[i], ex.frames[(i+1) % ex.frames.length], ex.linear ? u : ease(u));
}

/* ---------- App ---------- */
const stage = document.getElementById('stage');
const nav = document.getElementById('nav');
const $ = id => document.getElementById(id);
let pat = 0, alt = 0, cur = null;

PATTERNS.forEach((p,i) => {
  const b = document.createElement('button');
  b.textContent = p.label;
  b.onclick = () => { pat = i; alt = 0; show(); };
  nav.appendChild(b);
});

function show(){
  const p = PATTERNS[pat], o = p.opts[alt], ex = EX[o.ex];
  [...nav.children].forEach((b,i) => b.classList.toggle('on', i === pat));
  stage.querySelector('svg.fig')?.remove();
  const svg = el('svg', { viewBox:'0 0 300 215', class:'fig', role:'img', 'aria-label':'Animation : ' + ex.name });
  stage.prepend(svg);
  cur = { ex, fig: buildFigure(svg, ex), clock: 0 };
  render();
  $('tag').textContent = o.w;
  $('name').textContent = ex.name;
  $('dose').innerHTML = o.sets + (o.unit ? `<small>${o.unit}</small>` : '');
  $('cue').textContent = ex.cue;
  const many = p.opts.length > 1;
  $('prev').hidden = $('next').hidden = !many;
  $('dots').innerHTML = many ? p.opts.map((_,i) => `<i class="${i === alt ? 'on' : ''}"></i>`).join('') : '';
}
const step = d => { const k = PATTERNS[pat].opts.length; if (k > 1){ alt = (alt + d + k) % k; show(); } };
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
  if (/^[1-5]$/.test(e.key)){ pat = +e.key - 1; alt = 0; show(); }
});
let x0 = null;
stage.addEventListener('touchstart', e => x0 = e.touches[0].clientX, { passive:true });
stage.addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1);
});

function render(){
  draw(cur.fig, cur.ex, solve(cur.ex, poseAt(cur.ex, cur.clock)));
  if (cur.ex.walk) cur.fig.floor.setAttribute('stroke-dashoffset', n(cur.clock * cur.ex.stride / (2*cur.ex.durs[0])));
}
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now();
function tick(now){
  const dt = Math.min(now - last, 50); last = now;
  if (!still){ cur.clock += dt; render(); }
  requestAnimationFrame(tick);
}
show();
requestAnimationFrame(tick);
</script>
</body>
</html>
